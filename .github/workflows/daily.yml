name: Daily predictions

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST, after the NSE close
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-predict.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -r pipeline/requirements-predict.txt

      - name: Ingest new data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline/ingest.py --since "$(date -u -d '5 days ago' +%F)"

      - name: Predict
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: OmWattamwar/asset-fusion
        run: python pipeline/predict.py -v